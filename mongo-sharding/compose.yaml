services:

  mongos_router:
    image: mongo:latest
    container_name: mongos_router
    restart: always
    ports:
      - "27117:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.7
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/scripts/entrypoint-route.sh"]  

  configSrv:
    image: mongo:latest
    container_name: configSrv 
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - ./scripts:/scripts
      - config-data:/data/db
    entrypoint: ["/scripts/entrypoint-configserver.sh"]

  shard1:
    image: mongo:latest
    container_name: shard1
    restart: always
    ports:
      - "27018:27018"
    networks:
      app-network:
        ipv4_address: 173.17.0.9
    volumes:
      - ./scripts:/scripts
      - shard1-data:/data/db
    entrypoint: ["/bin/bash", "/scripts/entrypoint-shard01.sh"]

  shard2:
    image: mongo:latest
    container_name: shard2
    restart: always
    ports:
      - "27019:27019"
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    volumes:
      - ./scripts:/scripts
      - shard2-data:/data/db
    entrypoint: ["/bin/bash", "/scripts/entrypoint-shard02.sh"]

networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16

volumes:
  config-data:
  shard1-data:
  shard2-data:
